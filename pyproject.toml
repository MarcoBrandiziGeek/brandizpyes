[project]
name = "brandizpyes"
version = "3.0.1"
description = "Brandiz Pyes - Python Utilities"
authors = [
  { name = "Marco Brandizi" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11" # ^3.11 isn't valid in PyPI

[project.urls]
Repository = "https://github.com/MarcoBrandiziGeek/brandizpyes/"
Issues = "https://github.com/MarcoBrandiziGeek/brandizpyes/issues"
Changelog = "https://github.com/MarcoBrandiziGeek/brandizpyes/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0.3"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "assertpy (>=2.36.0,<3.0.0)",
    "autoflake (>=2.4.0,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
]

[tool.pytest.ini_options]
addopts = [ "-v" ]
# You don't need them, it's already managed by our own logging config helper
# log_cli = true
# log_level = "DEBUG"
